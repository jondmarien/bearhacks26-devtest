<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bear-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring (Subtle) -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#bear-glow)" stroke-width="1.5" opacity="0.4" />
  
  <!-- Stylized Bear Head -->
  <path 
    fill="url(#bear-glow)" 
    filter="url(#glow)"
    d="M50 20 L65 30 L65 45 L75 50 L75 70 L65 80 L35 80 L25 70 L25 50 L35 45 L35 30 Z" 
  />
  
  <!-- Eyes -->
  <circle cx="42" cy="55" r="2.5" fill="#000" />
  <circle cx="58" cy="55" r="2.5" fill="#000" />
  
  <!-- Ears -->
  <path fill="url(#bear-glow)" d="M30 25 Q30 15 40 22 L35 30 Z" />
  <path fill="url(#bear-glow)" d="M70 25 Q70 15 60 22 L65 30 Z" />
  
  <!-- Snout -->
  <path fill="rgba(0,0,0,0.2)" d="M45 65 L55 65 L50 72 Z" />
</svg>
